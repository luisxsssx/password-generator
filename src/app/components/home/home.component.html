<app-navbar />

<div class="container-lg page-container d-flex flex-column align-items-center justify-content-center">
  <div class="text-center mt-3 mt-md-4 mb-4">
    <h1 class="fw-bold">Random Password Generator</h1>
    <p class="text-muted">
      Create strong and secure passwords to keep your account safe online.
    </p>
  </div>

  <div class="password-card">
    <div class="password-display mb-4" *ngIf="generatedPassword">
      {{ generatedPassword }}
    </div>

    <div class="d-flex gap-2 mb-4 flex-wrap">
      <div class="input-group flex-grow-1">
        <button class="btn btn-refresh" type="button" (click)="generateRandomText(true)" title="Generate new password">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
        <input type="text" class="form-control form-control-lg" readonly [value]="generatedPassword" />
        <button class="btn btn-copy" type="button" (click)="copyToTheHolder()">
          Copy
        </button>
      </div>
    </div>

    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      *ngIf="showCopiedMessage"
      [class.fade-out]="isFadingOut"
    >
      <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto">Password Copied</strong>
          <small>Just now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
          The password has been copied to the clipboard
        </div>
      </div>
    </div>

    <div class="mb-4">
      <label for="passwordLength" class="form-label">
        Password length: <strong>{{ selectedValue }}</strong>
      </label>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm" (click)="decreaseValue()">
          −
        </button>
        <input
          type="range"
          class="form-range flex-grow-1"
          id="customRange1"
          min="1"
          max="32"
          [(ngModel)]="selectedValue"
          (input)="updateValue($event)"
        />
        <button class="btn btn-outline-secondary btn-sm" (click)="increaseValue()">
          +
        </button>
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label fw-medium">Characters used:</label>
    </div>

    <div class="character-options">
      <label
        class="char-option"
        [class.active]="options.includeUppercase"
      >
        <input
          type="checkbox"
          [checked]="options.includeUppercase"
          (click)="toggleOption('includeUppercase')"
          class="checkbox-hidden"
        />
        <span class="char-label">ABC</span>
        <span>Uppercase</span>
      </label>

      <label
        class="char-option"
        [class.active]="options.includeLowercase"
      >
        <input
          type="checkbox"
          [checked]="options.includeLowercase"
          (click)="toggleOption('includeLowercase')"
          class="checkbox-hidden"
        />
        <span class="char-label">abc</span>
        <span>Lowercase</span>
      </label>

      <label
        class="char-option"
        [class.active]="options.includeNumbers"
      >
        <input
          type="checkbox"
          [checked]="options.includeNumbers"
          (click)="toggleOption('includeNumbers')"
          class="checkbox-hidden"
        />
        <span class="char-label">123</span>
        <span>Numbers</span>
      </label>

      <label
        class="char-option"
        [class.active]="options.includeCharacter"
      >
        <input
          type="checkbox"
          [checked]="options.includeCharacter"
          (click)="toggleOption('includeCharacter')"
          class="checkbox-hidden"
        />
        <span class="char-label">#$&</span>
        <span>Symbols</span>
      </label>
    </div>
  </div>
</div>

<footer class="bg-body-tertiary text-center py-3">
  <div class="container">
    <p class="mb-0 text-muted small">
      © {{ currentYear }}
      <a class="text-body" href="https://github.com/luisxsssx">Luis Carlos</a>
    </p>
  </div>
</footer>
