<app-navbar />

<div class="container-lg page-container">
  <div class="text-center mt-3 mt-md-4 mb-3">
    <h2 class="fw-bold">Decrypt Text</h2>
  </div>

  <div class="container-fluid px-2 px-md-4">
    <div class="mx-auto" style="max-width: 900px;">
      <div class="textarea-wrapper mb-3" *ngIf="decryptedText">
        <button
          class="copy-btn"
          (click)="copyToClipboard()"
          title="Copy to clipboard"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
          </svg>
        </button>
      </div>

      <div class="row g-3 g-md-4">
        <div class="col-12 col-md-6">
          <textarea
            class="form-control"
            rows="8"
            placeholder="Enter text to decrypt here"
            [(ngModel)]="encryptedText"
          ></textarea>
        </div>
        <div class="col-12 col-md-6">
          <textarea
            class="form-control disabled-textarea"
            readonly
            rows="8"
            placeholder="Decrypted value will appear here"
          >{{ decryptedText }}</textarea>
        </div>
      </div>

      <div
        class="toast-container position-fixed bottom-0 end-0 p-3"
        *ngIf="showCopiedMessage"
        [ngClass]="{ 'fade-out': isFadingOut }"
      >
        <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <strong class="me-auto">Text Copied</strong>
            <small>Just now</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body">The text has been copied to the clipboard</div>
        </div>
      </div>

      <div
        class="toast-container position-fixed bottom-0 end-0 p-3"
        *ngIf="showErrorMessage"
        [ngClass]="{ 'fade-out': isFadingOut }"
      >
        <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <strong class="me-auto">Error</strong>
            <small>Just now</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body">The secret key is incorrect or the text cannot be decrypted.</div>
        </div>
      </div>

      <div
        class="toast-container position-fixed bottom-0 end-0 p-3"
        *ngIf="showWarningMessage"
        [ngClass]="{ 'fade-out': isFadingOut }"
      >
        <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <strong class="me-auto">Warning</strong>
            <small>Just now</small>
            <button type="button" class="btn-close" aria-label="Close"></button>
          </div>
          <div class="toast-body">Please enter the encrypted text and secret key.</div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12 col-sm-8 col-md-6">
          <input
            type="text"
            class="form-control password-input-group"
            placeholder="Secret Key"
            [(ngModel)]="secretKey"
          />
        </div>
      </div>

      <div class="text-center mt-4 mb-4">
        <button
          type="button"
          class="btn btn-decrypt btn-lg px-5"
          (click)="decrypt()"
        >
          Decrypt
        </button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-body-tertiary text-center py-3">
  <div class="container">
    <p class="mb-0 text-muted small">
      © {{ currentYear }}
      <a class="text-body" href="https://github.com/luisxsssx">Luis Carlos</a>
    </p>
  </div>
</footer>
